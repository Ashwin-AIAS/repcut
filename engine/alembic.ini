# Alembic configuration for the Repcut engine.
#
# sqlalchemy.url is deliberately EMPTY. env.py resolves the URL from Settings
# (DATABASE_URL if set, else $DATA_DIR/repcut.db), so no machine path is ever
# committed - see .claude/rules/secrets.md. Tests and the gate point at a
# scratch database by setting the option programmatically or by exporting
# DATABASE_URL.
#
#   alembic -c engine/alembic.ini upgrade head
#   alembic -c engine/alembic.ini downgrade base

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
