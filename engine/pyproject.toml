[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repcut-engine"
version = "0.1.0"
description = "Repcut engine - local-first FastAPI service for AI-assisted gym video editing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "httpx",
    "sqlalchemy[asyncio]>=2",
    "aiosqlite",
    "alembic",
    # Scene-cut detection (analysis/scenes.py). BSD-3-Clause, verified against
    # its GitHub LICENSE file rather than assumed (session report). No torch:
    # its own CV backend is opencv-python, declared explicitly below rather
    # than left as an unpinned transitive dependency.
    "scenedetect>=0.7,<0.8",
    # The CV backend scenedetect already requires, and the one analysis/sampler.py
    # reads Laplacian variance through - not opencv-python-headless: that
    # package and this one both install into the same `cv2/` namespace, and
    # scenedetect pulls this one in regardless, so declaring the headless
    # variant too would either conflict with it or sit there unused. Apache-2.0.
    "opencv-python>=4.9,<5",
]

# torch is installed out-of-band with a CUDA wheel index and is deliberately NOT
# a declared dependency: CI has no GPU, and the engine must boot without torch.
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    # Test-only, and only for the slow one: criterion 13 samples the engine's own
    # RSS while a 2GB clip arrives. Not a runtime dependency - the engine never
    # reads its own memory outside that measurement.
    "psutil",
    "types-psutil",
]

[tool.setuptools.packages.find]
include = ["repcut*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # pyupgrade
    "B",     # bugbear
    "ASYNC", # blocking calls on the event loop
    "ANN",   # missing annotations
    "SIM",   # simplification
    "RUF",   # ruff-specific
    "S",     # flake8-bandit: security
]

# S603/S607 are bandit's "you called a subprocess" and "you did not give an
# absolute path". Both are true of every FFmpeg call and both are correct here:
# `ffmpeg_builder` passes a `list[str]` to `create_subprocess_exec` with no
# shell, and resolving the executable through PATH is the point - the binary is
# wherever the user's package manager put it. The rules that actually matter -
# S602 (`shell=True`), S605/S606 (`os.system`, `os.popen`), S301 (`pickle`),
# S506 (`yaml.load`) - stay on.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and generate throwaway fixtures with predictable names. S101 is
# "you used assert", which is the entire vocabulary of a test suite; S108 is
# "hardcoded /tmp", which is what pytest's own tmp_path is.
"tests/**" = ["S101", "S108"]

[tool.ruff.lint.isort]
# engine/alembic/ is the migration directory, not the installed package, so
# without this ruff classifies `alembic` imports as first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
strict = true

# torch is optional at runtime and absent in CI; without this, every CI mypy run
# fails on an import it is not supposed to require.
[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

# scenedetect (analysis/scenes.py) and cv2 (analysis/sampler.py, analysis/motion.py)
# ship no inline types and no third-party stub package as of the pinned
# versions - unlike torch this is a real runtime dependency, so this is a
# permanent override, not a CI-only one.
[[tool.mypy.overrides]]
module = ["scenedetect.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU. Excluded in CI, run locally with `make test-gpu`.",
    "slow: full renders or long pipelines. Excluded from the fast test loop.",
]
