id = "hardstyle"
name = "Hardstyle"
description = "Hard contrast and strong colour. Built for bright, harsh light and fast sets."
default_intensity = 75

[look]
contrast = 0.45
pivot = 0.45
black_crush = 0.04
highlight_rolloff = 0.10
saturation = 1.15

[finish]
grain = 0.0

[[adapt]]
when = { lighting_temperature = "warm" }
temperature_shift_k = -300

[[adapt]]
when = { lighting_quality = "harsh" }
# Harsh light already has contrast; give the highlights room.
exposure_stops = -0.15

[recommend]
base = 0.1
lighting_quality = { harsh = 0.6, bright = 0.4 }

[pace]
# Fast: a cut every bar, every half bar in the drop.
energy = 0.9
calm_beats = 4
peak_beats = 2
