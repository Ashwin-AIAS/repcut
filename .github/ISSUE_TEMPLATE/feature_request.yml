name: Feature request
description: Suggest a capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Repcut makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Where would the user override it?
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      description: A request that conflicts with one of these will be declined.
      options:
        - label: "P1: it enhances captured footage and never generates or replaces content."
          required: true
        - label: "P2: any AI choice it adds is an overridable default."
          required: true
        - label: "P4: footage stays on the machine (at most one sampled frame per scene leaves it)."
          required: true
        - label: "P5: it needs no paid service."
          required: true
