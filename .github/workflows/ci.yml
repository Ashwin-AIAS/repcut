name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only set up Python (and its pip cache) once the engine exists. Before
      # Prompt 01 there is no dependency file to hash, and setup-python's cache
      # step errors out on that — turning the intended no-op into a red job.
      - uses: actions/setup-python@v5
        if: hashFiles('engine/pyproject.toml', 'engine/requirements-dev.txt') != ''
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          if [ -f engine/requirements-dev.txt ]; then
            pip install -r engine/requirements-dev.txt
          elif [ -f engine/pyproject.toml ]; then
            pip install -e "engine[dev]"
          else
            echo "Engine not scaffolded yet (Prompt 01) — skipping."
            exit 0
          fi

      - name: Lint (ruff)
        run: ruff check engine && ruff format --check engine
        if: hashFiles('engine/pyproject.toml') != ''

      # --config-file is load-bearing: run from the repo root, mypy only looks
      # for config in the current directory, so a bare `mypy engine` never finds
      # engine/pyproject.toml and silently type-checks in non-strict mode.
      - name: Type check (mypy)
        run: mypy --config-file engine/pyproject.toml engine
        if: hashFiles('engine/pyproject.toml') != ''

      # No GPU on GitHub runners. GPU tests are marked and run locally
      # via `make test-gpu` before every gate.
      - name: Tests (CPU only)
        run: pytest engine -m "not gpu" -q
        if: hashFiles('engine/pyproject.toml') != ''

  ui:
    name: UI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only set up Node (and its npm cache) once the UI exists. Before Prompt
      # 01 there is no ui/package-lock.json, and setup-node fails hard on a
      # missing cache-dependency-path — turning the intended no-op into a red job.
      - uses: actions/setup-node@v4
        if: hashFiles('ui/package-lock.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          if [ -f ui/package.json ]; then
            cd ui && npm ci
          else
            echo "UI not scaffolded yet (Prompt 01) — skipping."
            exit 0
          fi

      - name: Lint + typecheck + test + build
        if: hashFiles('ui/package.json') != ''
        run: |
          cd ui
          npm run lint
          npx tsc --noEmit
          npm run test --if-present
          npm run build

  # A public AGPL repo with a public dependency tree. Both scanners are free and
  # need no account (P5). This job exists because "next@14 has 6 high advisories"
  # was found by hand during a security review, months after the pin was set -
  # nothing in CI was looking, so nothing said so.
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: hashFiles('engine/pyproject.toml') != ''
        with:
          python-version: "3.11"

      - name: Python advisories (pip-audit)
        if: hashFiles('engine/pyproject.toml') != ''
        run: |
          pip install --quiet pip-audit
          pip install --quiet -e engine
          pip-audit --strict --progress-spinner off

      - uses: actions/setup-node@v4
        if: hashFiles('ui/package-lock.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Production dependencies only. A lint plugin's transitive advisory is
      # real but is not reachable by anything the user runs, and failing the
      # build on it trains everyone to pass --force, which is how the actual
      # finding gets waved through next time.
      - name: Node advisories (npm audit)
        if: hashFiles('ui/package-lock.json') != ''
        run: cd ui && npm audit --omit=dev --audit-level=high

  guardrails:
    name: Repo guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLAUDE.md invariants present
        run: |
          set -e
          for p in "P1 Natural only" "P2 AI recommends" "P3" "P4" "P5"; do
            grep -q "$p" CLAUDE.md || { echo "::error::CLAUDE.md missing invariant: $p"; exit 1; }
          done
          grep -qi "never commit" CLAUDE.md || { echo "::error::CLAUDE.md missing the secrets policy"; exit 1; }
          echo "CLAUDE.md OK"
