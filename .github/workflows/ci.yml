name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only set up Python (and its pip cache) once the engine exists. Before
      # Prompt 01 there is no dependency file to hash, and setup-python's cache
      # step errors out on that — turning the intended no-op into a red job.
      - uses: actions/setup-python@v5
        if: hashFiles('engine/pyproject.toml', 'engine/requirements-dev.txt') != ''
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          if [ -f engine/requirements-dev.txt ]; then
            pip install -r engine/requirements-dev.txt
          elif [ -f engine/pyproject.toml ]; then
            pip install -e "engine[dev]"
          else
            echo "Engine not scaffolded yet (Prompt 01) — skipping."
            exit 0
          fi

      - name: Lint (ruff)
        run: ruff check engine scripts && ruff format --check engine scripts
        if: hashFiles('engine/pyproject.toml') != ''

      # --config-file is load-bearing: run from the repo root, mypy only looks
      # for config in the current directory, so a bare `mypy engine` never finds
      # engine/pyproject.toml and silently type-checks in non-strict mode.
      - name: Type check (mypy)
        run: mypy --config-file engine/pyproject.toml engine
        if: hashFiles('engine/pyproject.toml') != ''

      # No GPU on GitHub runners. GPU tests are marked and run locally
      # via `make test-gpu` before every gate.
      #
      # `not slow` as well, which this had been missing: `testing.md` says slow
      # is excluded from the fast loop, amendment 004 §3 says the 2GB memory
      # test runs at the gate and not in CI, and the marker expression here
      # excluded neither. So it ran whenever a runner happened to have 5GB free
      # - and its budget is a measurement of the target laptop, not of a 2-core
      # runner. It measured 525MB against the 500MB budget on the first PR after
      # the prompt-02 merge, and 318-passed on the one before it: a gate that
      # fails on which runner it lands on teaches people to re-run CI, which is
      # the habit that makes a real failure invisible.
      #
      # The budget is NOT raised and the test is NOT weakened. `verify-02`
      # criterion 13 still runs it at every gate, on the machine whose memory it
      # is a claim about, and still fails the gate there.
      - name: Tests (CPU only)
        run: pytest engine -m "not gpu and not slow" -q
        if: hashFiles('engine/pyproject.toml') != ''

  ui:
    name: UI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only set up Node (and its npm cache) once the UI exists. Before Prompt
      # 01 there is no ui/package-lock.json, and setup-node fails hard on a
      # missing cache-dependency-path — turning the intended no-op into a red job.
      - uses: actions/setup-node@v4
        if: hashFiles('ui/package-lock.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          if [ -f ui/package.json ]; then
            cd ui && npm ci
          else
            echo "UI not scaffolded yet (Prompt 01) — skipping."
            exit 0
          fi

      - name: Lint + typecheck + test + build
        if: hashFiles('ui/package.json') != ''
        run: |
          cd ui
          npm run lint
          npx tsc --noEmit
          npm run test --if-present
          npm run build

  # A public AGPL repo with a public dependency tree. Both scanners are free and
  # need no account (P5). This job exists because "next@14 has 6 high advisories"
  # was found by hand during a security review, months after the pin was set -
  # nothing in CI was looking, so nothing said so.
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: hashFiles('engine/pyproject.toml') != ''
        with:
          python-version: "3.11"

      # Audit the engine's resolved dependencies, from a venv that holds
      # nothing else. Two reasons it is not just `pip install -e engine &&
      # pip-audit`:
      #
      #  - `--strict` fails on any package pip-audit cannot look up, and the
      #    first one is `repcut-engine` itself - installed editable, never
      #    published to PyPI. The job died there and audited zero dependencies
      #    for as long as it existed. `--skip-editable` does not fix it either:
      #    under `--strict` a skipped package is an error too.
      #  - Auditing the ambient environment would also audit pip-audit's own
      #    dependency tree, which is not something the user runs - the same
      #    reason the npm step below is `--omit=dev`.
      #
      # `--strict` stays. A third-party dependency that cannot be audited is
      # still a failure; only the project's own unpublishable package is out of
      # scope, because there is no advisory feed that could ever have it.
      - name: Python advisories (pip-audit)
        if: hashFiles('engine/pyproject.toml') != ''
        run: |
          python -m venv "$RUNNER_TEMP/auditenv"
          "$RUNNER_TEMP/auditenv/bin/pip" install --quiet -e engine
          "$RUNNER_TEMP/auditenv/bin/pip" freeze --exclude-editable > "$RUNNER_TEMP/engine-deps.txt"
          echo "auditing $(wc -l < "$RUNNER_TEMP/engine-deps.txt") resolved dependencies"
          pip install --quiet pip-audit
          pip-audit --strict --progress-spinner off -r "$RUNNER_TEMP/engine-deps.txt"

      - uses: actions/setup-node@v4
        if: hashFiles('ui/package-lock.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Production dependencies only. A lint plugin's transitive advisory is
      # real but is not reachable by anything the user runs, and failing the
      # build on it trains everyone to pass --force, which is how the actual
      # finding gets waved through next time.
      - name: Node advisories (npm audit)
        if: hashFiles('ui/package-lock.json') != ''
        run: cd ui && npm audit --omit=dev --audit-level=high

  guardrails:
    name: Repo guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLAUDE.md invariants present
        run: |
          set -e
          for p in "P1 Natural only" "P2 AI recommends" "P3" "P4" "P5"; do
            grep -q "$p" CLAUDE.md || { echo "::error::CLAUDE.md missing invariant: $p"; exit 1; }
          done
          grep -qi "never commit" CLAUDE.md || { echo "::error::CLAUDE.md missing the secrets policy"; exit 1; }
          echo "CLAUDE.md OK"
