# Local guardrails. Install once:  pip install pre-commit && pre-commit install
# Never bypass with `git commit --no-verify`.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks — block secrets (PUBLIC REPO)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: local
    hooks:
      - id: public-repo-guard
        name: block secrets, media, model weights and project docs
        entry: scripts/precommit_guard.sh
        language: script
        stages: [pre-commit]

  # Keep this rev in step with the ruff `make lint` and CI resolve. They format
  # differently - 0.9 changed how an assert's message is wrapped - so a stale
  # pin here rewrites code on commit into a shape `ruff format --check` then
  # rejects, and the PR fails CI on a file the author never touched.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^engine/
      - id: ruff-format
        files: ^engine/
